<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151619">
  <meta name="description" content="clqn is one terminal chat for your team and its AI agents: ask, approve, and merge without leaving the terminal.">
  <title>clqn</title>
  <link rel="canonical" href="https://clqn.org/">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">

<body class="home-body">
  <main class="home" aria-label="clqn">
    <div class="terminal">
      <header class="bar">
        <span class="path"><span aria-hidden="true">~/</span>clqn</span>
        <nav class="links" aria-label="Project links">
          <a href="https://github.com/clqn-org/clqn">GitHub</a>

      <div class="art">
        <picture class="groundhogs">
          <source media="(prefers-reduced-motion: no-preference)" srcset="groundhogs.svg">
          <img src="groundhogs-still.svg" width="680" height="620" alt="Three ASCII groundhogs popping out of separate holes">

    <p class="about">One terminal chat for your team and its AI agents. Ask, approve, merge.</p>
    <nav class="actions" aria-label="Project">
      <a class="primary" href="download.html">Download</a>
